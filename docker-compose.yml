services:
  postgres:
    image: postgres:16
    container_name: hotel_postgres
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
      POSTGRES_DB: hotel_dw
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d hotel_dw"]
      interval: 5s
      timeout: 5s
      retries: 5