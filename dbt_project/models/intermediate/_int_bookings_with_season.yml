version: 2

models:
  - name: int_bookings_with_season
    description: "Intermediate model joining stg_bookings to seed_hotel_seasons on hotel and arrival month, adding a season (High/Low) classification for use in downstream marts and analyses."
    columns:

      - name: season
        description: "Seasonality classification (High/Low) for the booking's arrival month, based on observed monthly ADR medians per hotel. Sourced from seed_hotel_seasons."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Low", "High"]

      # All other columns (booking_id, hotel, is_canceled, average_daily_rate, etc.)
      # pass through unchanged from stg_bookings via `b.*`.
      # See stg_bookings.yml for their descriptions and tests.